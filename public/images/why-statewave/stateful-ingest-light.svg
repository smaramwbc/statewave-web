<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="80 50 970 800">
  <style>
    .tile { opacity:0; animation: tileIn .8s cubic-bezier(.22,1,.36,1) forwards; }
    .tile-1 { animation-delay:.1s; } .tile-2 { animation-delay:.22s; } .tile-3 { animation-delay:.34s; }
    .tile-4 { animation-delay:.46s; } .tile-5 { animation-delay:.58s; }
    @keyframes tileIn { from { opacity:0; transform:translateX(-22px);} to { opacity:1; transform:translateX(0);} }

    #layers-icon-wrap { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: popIn .85s cubic-bezier(.34,1.4,.64,1) 1.25s forwards; }
    #bolt-wrap { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: popIn .8s cubic-bezier(.34,1.4,.64,1) 1.45s forwards; }
    #bolt-wrap path { transform-box:fill-box; transform-origin:center; animation: boltPulse 3.6s ease-in-out 2.6s infinite; }
    @keyframes popIn { from { opacity:0; transform:scale(.6);} to { opacity:1; transform:scale(1);} }
    @keyframes boltPulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.72; transform:scale(.94);} }

    .wire { stroke-dasharray:1; stroke-dashoffset:1; animation: drawWire .9s cubic-bezier(.65,0,.35,1) forwards; }
    .wire-1 { animation-delay:1.4s; } .wire-2 { animation-delay:1.5s; } .wire-3 { animation-delay:1.6s; }
    .wire-4 { animation-delay:1.7s; } .wire-5 { animation-delay:1.8s; }
    @keyframes drawWire { to { stroke-dashoffset:0; } }

    .ndot { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: dotIn .45s ease-out forwards, dotBeat 4s ease-in-out infinite; }
    .ndot-1 { animation-delay:2.2s,3.2s; } .ndot-2 { animation-delay:2.3s,3.6s; }
    .ndot-3 { animation-delay:2.4s,4s; } .ndot-4 { animation-delay:2.5s,4.4s; } .ndot-5 { animation-delay:2.6s,4.8s; }
    @keyframes dotIn { from { opacity:0; transform:scale(0);} to { opacity:1; transform:scale(1);} }
    @keyframes dotBeat { 0%,100% { transform:scale(1);} 50% { transform:scale(1.3);} }

    #stack-anchor { animation: floatY 7s ease-in-out 2.2s infinite; }
    @keyframes floatY { 0%,100% { transform:translateY(0);} 50% { transform:translateY(-4px);} }

    @media (prefers-reduced-motion: reduce) {
      .tile,#layers-icon-wrap,#bolt-wrap,.ndot { opacity:1; animation:none; }
      .wire { stroke-dashoffset:0; animation:none; }
      #stack-anchor,#bolt-wrap path { animation:none; }
      .pulse { display:none; }
    }
  </style>
  <defs>
    <linearGradient id="Degradado_sin_nombre_111" x1="144.44951" y1="375.9717" x2="854.54" y2="309.23387" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
<linearGradient id="wg-message" gradientUnits="userSpaceOnUse" x1="251" y1="0" x2="592" y2="0">
      <stop offset="0" stop-color="#0a9cc4"/><stop offset="1" stop-color="#0a9cc4"/>
    </linearGradient>
    <linearGradient id="wg-code" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="592" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0a9cc4"/>
    </linearGradient>
    <linearGradient id="wg-user" gradientUnits="userSpaceOnUse" x1="211" y1="0" x2="592" y2="0">
      <stop offset="0" stop-color="#0ea5a0"/><stop offset="1" stop-color="#0a9cc4"/>
    </linearGradient>
    <linearGradient id="wg-git" gradientUnits="userSpaceOnUse" x1="206" y1="0" x2="592" y2="0">
      <stop offset="0" stop-color="#8b47e8"/><stop offset="1" stop-color="#0a9cc4"/>
    </linearGradient>
    <linearGradient id="wg-clock" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="592" y2="0">
      <stop offset="0" stop-color="#3b6fd4"/><stop offset="1" stop-color="#0a9cc4"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="node-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

