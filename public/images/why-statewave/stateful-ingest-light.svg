          </g>
          <path fill="#7a5cff" d="M829.34794,671.23408c-11.31723-2.89377-23.29954-1.59111-33.73053,3.66704l-227.83842,114.85091c-45.45651,22.55709-98.84703,22.55709-144.30354,0l-210.28486-104.34999c-13.89141-6.89337-30.21061-6.87765-44.08871.04242v.00008c-36.93042,18.41465-36.87963,71.12522.08609,89.46873l254.28748,126.18547c45.45651,22.55701,98.84703,22.55701,144.30354,0l271.20845-138.74012c11.51212-5.88917,20.18443-16.14567,24.07815-28.47653l.39979-1.26608c8.35549-26.46072-7.2337-54.50786-34.11736-61.38191l-.00007-.00002Z"/>
