<?xml version="1.0" encoding="UTF-8"?>
<svg id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 550 540">
  <defs>
    <style>
      .st0 { fill: #7a5cff; }
      .st1 { fill: url(#Degradado_sin_nombre_3); }
      .st1, .st2, .st3 { stroke: #a9c3ff; stroke-opacity: .9; }
      .st2 { fill: url(#Degradado_sin_nombre_2); }
      .st3 { fill: url(#Degradado_sin_nombre_4); }
      .st4 { isolation: isolate; }
      .st5 { fill: #7a5cff; }
      .st6 { stroke: #5b94ff; stroke-dasharray: 6 9; stroke-opacity: .6; stroke-width: 2px; }
      .st6, .st7, .st8 { fill: none; }
      .st9 { fill: url(#Degradado_sin_nombre); }
      .st10 { fill-opacity: .2; }
      .st10, .st11 { fill: #64748b; }
      .st11 { fill-opacity: .32; }
      .st12 { fill: url(#Degradado_sin_nombre_8); }
      .st13 { fill: #6366f1; }
      .st7 { stroke-opacity: .16; }
      .st7, .st8 { stroke: #5a91f7; }
      .st8 { stroke-opacity: .22; }
      .st14 { fill: #5b94ff; }
      .st15 { fill: #00c6ff; }
      .st16 { fill: #4d8dff; }

      /* ---- Animación: una sola reproducción, sin bucle ---- */
      .anim {
        opacity: 0;
        animation-fill-mode: both;
        animation-iteration-count: 1;
        animation-timing-function: cubic-bezier(.2, .7, .2, 1);
        transform-box: fill-box;
        transform-origin: center;
      }
      .a-circle { animation-name: circIn; animation-duration: 1s; }
      .a-icon   { animation-name: popIn;  animation-duration: .9s; }
      .a-line   { animation-name: fadeIn; animation-duration: .6s; }
      .a-dot    { animation-name: dotPop; animation-duration: .5s; }
      .a-card   { animation-name: cardIn; animation-duration: .8s; }

      @keyframes circIn {
        from { opacity: 0; transform: scale(.82); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes popIn {
        0%   { opacity: 0; transform: scale(.5); }
        70%  { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes dotPop {
        0%   { opacity: 0; transform: scale(0); }
        60%  { transform: scale(1.4); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(16px) scale(.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .anim { opacity: 1; animation: none; }
      }
    </style>
    <radialGradient id="Degradado_sin_nombre" data-name="Degradado sin nombre" cx="-30.7963" cy="666.87407" fx="-30.7963" fy="666.87407" r="1" gradientTransform="translate(-179781 8585) rotate(90) scale(270 -270)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#347dff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#347dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="Degradado_sin_nombre_2" data-name="Degradado sin nombre 2" x1="82.74478" y1="638.59678" x2="270.74479" y2="457.59677" gradientTransform="translate(0 542) scale(1 -1)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#eef3fb" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="Degradado_sin_nombre_3" data-name="Degradado sin nombre 3" x1="-169.81541" y1="376.26909" x2="18.1846" y2="195.26907" gradientTransform="translate(0 542) scale(1 -1)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#eef3fb" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="Degradado_sin_nombre_4" data-name="Degradado sin nombre 4" x1="-1.45257" y1="551.14318" x2="186.54743" y2="370.14317" gradientTransform="translate(0 542) scale(1 -1)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#eef3fb" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="Degradado_sin_nombre_8" data-name="Degradado sin nombre 8" x1="211.80821" y1="39.95652" x2="338.0122" y2="28.09523" gradientTransform="translate(0 208)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
  </defs>

  <!-- Anillos concéntricos -->
