    .dot-6b { animation-delay:1.33s,3.23s; }
    .node-6 { animation-delay:1.38s; }

    @media (prefers-reduced-motion: reduce) {
      .ring,#hub-icon-wrap,#hub-icon-wrap #bolt-wrap,.link-dot,.node { opacity:1; animation:none; }
      .link { stroke-dashoffset:0; animation:none; }
    }
  </style>
