<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="78 51 998 1009">
  <style>
    .ring { opacity:0; animation: ringFade 1.4s ease-out .1s forwards; }
    @keyframes ringFade { to { opacity:1; } }

    #hub-icon-wrap { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: popIn .8s cubic-bezier(.34,1.4,.64,1) .25s forwards; }
    #hub-icon-wrap #bolt-wrap { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: popIn .75s cubic-bezier(.34,1.4,.64,1) .45s forwards; }
    @keyframes popIn { from { opacity:0; transform:scale(.6);} to { opacity:1; transform:scale(1);} }

    .link { stroke-dasharray:1; stroke-dashoffset:1; animation: drawLink .7s cubic-bezier(.65,0,.35,1) forwards; }
    @keyframes drawLink { to { stroke-dashoffset:0; } }

    .link-dot { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: dotPop .4s ease-out forwards, dotBeat 4s ease-in-out infinite; }
    @keyframes dotPop { from { opacity:0; transform:scale(0);} to { opacity:1; transform:scale(1);} }
    @keyframes dotBeat { 0%,100% { transform:scale(1);} 50% { transform:scale(1.3);} }

    .node { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: nodeIn .7s cubic-bezier(.34,1.4,.64,1) forwards; }
    @keyframes nodeIn { from { opacity:0; transform:scale(.55);} to { opacity:1; transform:scale(1);} }

    .link-0 { animation-delay:0.15s; }
    .dot-0a { animation-delay:0.37s,1.97s; }
    .dot-0b { animation-delay:0.55s,2.45s; }
