<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="388 106 760 788" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <style>
    /* ===== Entrada ===== */
    .core-in { opacity:0; transform-origin:768px 494px;
      animation: coreIn 1s cubic-bezier(.22,1,.36,1) .15s forwards; }
    @keyframes coreIn { from { opacity:0; transform:scale(.88);} to { opacity:1; transform:scale(1);} }

    .plate { opacity:0; animation: plateIn .8s cubic-bezier(.22,1,.36,1) forwards; }
    .plate-1 { animation-delay:.45s; } .plate-2 { animation-delay:.6s; }
    .plate-3 { animation-delay:.75s; } .plate-4 { animation-delay:.9s; }
    @keyframes plateIn { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:translateY(0);} }

    #pulse-line { stroke-dasharray:1; stroke-dashoffset:1;
      animation: drawWire .6s cubic-bezier(.65,0,.35,1) 1.25s forwards, linePulse 3.6s ease-in-out 2.6s infinite; }
    @keyframes linePulse { 0%,100% { opacity:1;} 50% { opacity:.6;} }

    .node { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: nodeIn .8s cubic-bezier(.34,1.45,.64,1) forwards; }
    #node-record { animation-delay:1.0s; } #node-compile { animation-delay:1.15s; }
    #node-context { animation-delay:1.3s; } #node-govern { animation-delay:1.45s; }
    @keyframes nodeIn { from { opacity:0; transform:scale(.6);} to { opacity:1; transform:scale(1);} }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-8px);} to { opacity:1; transform:translateY(0);} }

    .arc { stroke-dasharray:1; stroke-dashoffset:1; animation: drawWire .75s cubic-bezier(.65,0,.35,1) forwards; }
    #arc-2 { animation-delay:1.75s; } #arc-3 { animation-delay:2.0s; }
    #arc-4 { animation-delay:2.25s; } #arc-1 { stroke-dashoffset:-1; animation-delay:2.5s; }
    @keyframes drawWire { to { stroke-dashoffset:0; } }

    .arrowhead { opacity:0; animation: fadeIn .3s ease-out forwards; }
    .ah-1 { animation-delay:2.35s; } .ah-2 { animation-delay:2.6s; }
    .ah-3 { animation-delay:2.85s; } .ah-4 { animation-delay:3.1s; }
    @keyframes fadeIn { to { opacity:1;} }

    #dotted-links circle { opacity:0; transform-box:fill-box; transform-origin:center;
      animation: dotIn .45s ease-out 2.7s forwards, dotBeat 4s ease-in-out 3.4s infinite; }
    @keyframes dotIn { from { opacity:0; transform:scale(0);} to { opacity:1; transform:scale(1);} }
    @keyframes dotBeat { 0%,100% { transform:scale(1);} 50% { transform:scale(1.3);} }

    /* ===== Ambiente ===== */
    #core { animation: floatY 7s ease-in-out 2s infinite; }
    @keyframes floatY { 0%,100% { transform:translateY(0);} 50% { transform:translateY(-4px);} }
    #ambient g circle { animation: twinkle 5s ease-in-out infinite; }
    #ambient g circle:nth-child(2n) { animation-delay:1.6s; }
    #ambient g circle:nth-child(3n) { animation-delay:3.2s; }
    @keyframes twinkle { 0%,100% { opacity:1;} 50% { opacity:.3;} }

    @media (prefers-reduced-motion: reduce) {
      .core-in,.plate,.node,.arrowhead,#dotted-links circle { opacity:1; animation:none; }
      .arc,#pulse-line { stroke-dashoffset:0; animation:none; }
      #core,#ambient g circle { animation:none; }
      .pulse { display:none; }
    }
  </style>
  <defs>
    <!-- Gradientes de los arcos (userSpace para seguir la dirección de cada tramo) -->
    <linearGradient id="arc-left-top" gradientUnits="userSpaceOnUse" x1="491.7" y1="382.4" x2="656.4" y2="217.7">
      <stop offset="0" stop-color="#0ea770"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="arc-top-right" gradientUnits="userSpaceOnUse" x1="879.6" y1="217.7" x2="1044.3" y2="382.4">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arc-right-bottom" gradientUnits="userSpaceOnUse" x1="1044.3" y1="605.6" x2="879.6" y2="770.3">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="arc-bottom-left" gradientUnits="userSpaceOnUse" x1="656.4" y1="770.3" x2="491.7" y2="605.6">
      <stop offset="0" stop-color="#4b6ce0"/><stop offset="1" stop-color="#4f6ef7"/>
    </linearGradient>
    <!-- Gradiente del stack central -->
    <linearGradient id="stack-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ba4e8"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hex-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5ff0"/><stop offset="1" stop-color="#6d5cf6"/>
    </linearGradient>
    <!-- Resplandor suave -->
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Puntas de flecha (una por color de llegada) -->
  </defs>

  <!-- Anillos ambientales y motas -->
  <g id="ambient">
    <circle cx="768" cy="494" r="252" fill="none" stroke="#c5cfee" stroke-opacity=".28"/>
    <circle cx="768" cy="494" r="206" fill="none" stroke="#c5cfee" stroke-opacity=".18"/>
    <g fill="#5b6cf0" opacity=".5">
      <circle cx="500" cy="268" r="2.5"/><circle cx="1022" cy="244" r="2"/>
      <circle cx="1112" cy="664" r="2.5"/><circle cx="420" cy="610" r="2"/>
      <circle cx="884" cy="880" r="2.5"/><circle cx="640" cy="120" r="2"/>
      <circle cx="1122" cy="318" r="2" fill="#14b8a6"/><circle cx="414" cy="332" r="2" fill="#14b8a6"/>
    </g>
  </g>

  <!-- Arcos del ciclo (sentido horario: 01 -> 02 -> 03 -> 04 -> 01) -->
  <g id="cycle-arcs" fill="none" stroke-width="3.5" stroke-linecap="round">
    <path id="arc-1" class="arc" pathLength="1" d="M656.4,217.7 A298,298 0 0 0 491.7,382.4" stroke="url(#arc-left-top)"/>
    <path id="arc-2" class="arc" pathLength="1" d="M879.6,217.7 A298,298 0 0 1 1044.3,382.4" stroke="url(#arc-top-right)"/>
    <path id="arc-3" class="arc" pathLength="1" d="M1044.3,605.6 A298,298 0 0 1 879.6,770.3" stroke="url(#arc-right-bottom)"/>
    <path id="arc-4" class="arc" pathLength="1" d="M656.4,770.3 A298,298 0 0 1 491.7,605.6" stroke="url(#arc-bottom-left)"/>
  
    <path class="arrowhead ah-1" transform="translate(1044.3,382.4) rotate(68)" d="M-9,-7 L2,0 L-9,7" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="arrowhead ah-2" transform="translate(879.6,770.3) rotate(158)" d="M-9,-7 L2,0 L-9,7" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="arrowhead ah-3" transform="translate(491.7,605.6) rotate(248)" d="M-9,-7 L2,0 L-9,7" fill="none" stroke="#4f6ef7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="arrowhead ah-4" transform="translate(656.4,217.7) rotate(338)" d="M-9,-7 L2,0 L-9,7" fill="none" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Conectores punteados nodo -> núcleo -->
  <g id="dotted-links">
    <g fill="#14b8a6">
      <circle cx="768" cy="292" r="4"/><circle cx="768" cy="316" r="3.4"/>
      <circle cx="768" cy="338" r="2.8"/><circle cx="768" cy="358" r="2.2"/>
    </g>
    <g fill="#7c3aed">
      <circle cx="972" cy="494" r="4"/><circle cx="948" cy="494" r="3.4"/>
      <circle cx="926" cy="494" r="2.8"/><circle cx="906" cy="494" r="2.2"/>
    </g>
    <g fill="#4b6ce0">
      <circle cx="768" cy="696" r="4"/><circle cx="768" cy="672" r="3.4"/>
      <circle cx="768" cy="650" r="2.8"/><circle cx="768" cy="630" r="2.2"/>
    </g>
    <g fill="#0ea770">
      <circle cx="564" cy="494" r="4"/><circle cx="588" cy="494" r="3.4"/>
      <circle cx="610" cy="494" r="2.8"/><circle cx="630" cy="494" r="2.2"/>
    </g>
  </g>

  <!-- Núcleo: hexágono + stack de capas con pulso -->
  <g id="core">
    <path id="hex-outer" class="core-in" fill="none" stroke="#c0c9ec" stroke-opacity=".45" stroke-width="2"
      d="M750.4,375.5 Q768,366 785.6,375.5 L868.4,420.5 Q886,430 886,450 L886,538 Q886,558 868.4,567.5 L785.6,612.5 Q768,622 750.4,612.5 L667.6,567.5 Q650,558 650,538 L650,450 Q650,430 667.6,420.5 Z" transform="translate(768,494) scale(1.22) translate(-768,-494)"/>
    <path id="hex-frame" class="core-in" filter="url(#soft-glow)" fill="#f7f8ff" fill-opacity=".85" stroke="url(#hex-gradient)" stroke-width="3"
      d="M750.4,375.5 Q768,366 785.6,375.5 L868.4,420.5 Q886,430 886,450 L886,538 Q886,558 868.4,567.5 L785.6,612.5 Q768,622 750.4,612.5 L667.6,567.5 Q650,558 650,538 L650,450 Q650,430 667.6,420.5 Z"/>
    <!-- Capas (de abajo arriba; cada plato ocluye al anterior) -->
    <g id="stack" stroke="url(#stack-gradient)" stroke-width="5" stroke-linejoin="round" fill="#f7f8ff">
      <path class="plate plate-1" d="M778.7,511.4 L831.3,537.6 Q842.0,543.0 831.3,548.4 L778.7,574.6 Q768.0,580.0 757.3,574.6 L704.7,548.4 Q694.0,543.0 704.7,537.6 L757.3,511.4 Q768.0,506.0 778.7,511.4 Z"/>
      <path class="plate plate-2" d="M778.7,485.4 L831.3,511.6 Q842.0,517.0 831.3,522.4 L778.7,548.6 Q768.0,554.0 757.3,548.6 L704.7,522.4 Q694.0,517.0 704.7,511.6 L757.3,485.4 Q768.0,480.0 778.7,485.4 Z"/>
      <path class="plate plate-3" d="M778.7,459.4 L831.3,485.6 Q842.0,491.0 831.3,496.4 L778.7,522.6 Q768.0,528.0 757.3,522.6 L704.7,496.4 Q694.0,491.0 704.7,485.6 L757.3,459.4 Q768.0,454.0 778.7,459.4 Z"/>
      <path class="plate plate-4" id="stack-top" d="M779.6,413.8 L836.4,442.2 Q848.0,448.0 836.4,453.8 L779.6,482.2 Q768.0,488.0 756.4,482.2 L699.6,453.8 Q688.0,448.0 699.6,442.2 L756.4,413.8 Q768.0,408.0 779.6,413.8 Z" fill="#ecefff"/>
    </g>
    <!-- Pulso sobre la capa superior -->
    <path id="pulse-line" pathLength="1" fill="none" stroke="#4f6ef7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
      d="M726,448 h18 l10,-13 14,26 10,-13 h18"/>
  </g>

  <!-- Nodos -->
  <g id="nodes" stroke-width="2">
    <g id="node-record" class="node">
      <circle cx="768" cy="196" r="68" fill="#e3f7f4" fill-opacity=".85" stroke="#0ea5a0" filter="url(#soft-glow)"/>
      <g fill="none" stroke="#0ea5a0" stroke-width="4.5" stroke-linecap="round">
        <circle cx="768" cy="182" r="14"/>
        <path d="M744,224 a24,24 0 0 1 48,0"/>
      </g>
    </g>
    <g id="node-compile" class="node">
      <circle cx="1066" cy="494" r="68" fill="#f0eafe" fill-opacity=".85" stroke="#8b5cf6" filter="url(#soft-glow)"/>
      <g fill="none" stroke="#7c3aed" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1042,478 L1026,494 L1042,510"/>
        <path d="M1090,478 L1106,494 L1090,510"/>
        <path d="M1073,472 L1059,516"/>
      </g>
    </g>
    <g id="node-context" class="node">
      <circle cx="768" cy="792" r="68" fill="#e9eefe" fill-opacity=".85" stroke="#4b6ce0" filter="url(#soft-glow)"/>
      <g fill="none" stroke="#3f63e8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M740,768 h56 a10,10 0 0 1 10,10 v26 a10,10 0 0 1 -10,10 h-40 l-14,14 v-14 h-2 a10,10 0 0 1 -10,-10 v-26 a10,10 0 0 1 10,-10 Z"/>
      </g>
      <g fill="#3f63e8">
        <circle cx="754" cy="791" r="3"/><circle cx="768" cy="791" r="3"/><circle cx="782" cy="791" r="3"/>
      </g>
    </g>
    <g id="node-govern" class="node">
      <circle cx="470" cy="494" r="68" fill="#e3f6ee" fill-opacity=".85" stroke="#0ea770" filter="url(#soft-glow)"/>
      <g fill="none" stroke="#0ea770" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M470,462 c10,7 20,10 26,10 v25 c0,18 -12,28 -26,35 -14,-7 -26,-17 -26,-35 v-25 c6,0 16,-3 26,-10 Z"/>
        <path d="M458,494 l9,9 16,-18"/>
      </g>
    </g>
  </g>

  
  <filter id="comet-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g class="pulse" filter="url(#comet-glow)" opacity="0">
    <circle r="6" fill="#8b5cf6" opacity=".3"/><circle r="2.8" fill="#5b21b6"/>
    <animateMotion path="M879.6,217.7 A298,298 0 0 1 1044.3,382.4" dur="1.1s" begin="3.5s" repeatCount="1" fill="remove" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="1.1s" begin="3.5s" repeatCount="1" fill="remove"/>
  </g>
  <g class="pulse" filter="url(#comet-glow)" opacity="0">
    <circle r="6" fill="#a855f7" opacity=".3"/><circle r="2.8" fill="#7e22ce"/>
    <animateMotion path="M1044.3,605.6 A298,298 0 0 1 879.6,770.3" dur="1.1s" begin="4.6s" repeatCount="1" fill="remove" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="1.1s" begin="4.6s" repeatCount="1" fill="remove"/>
  </g>
  <g class="pulse" filter="url(#comet-glow)" opacity="0">
    <circle r="6" fill="#4f6ef7" opacity=".3"/><circle r="2.8" fill="#3450c8"/>
    <animateMotion path="M656.4,770.3 A298,298 0 0 1 491.7,605.6" dur="1.1s" begin="5.7s" repeatCount="1" fill="remove" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="1.1s" begin="5.7s" repeatCount="1" fill="remove"/>
  </g>
  <g class="pulse" filter="url(#comet-glow)" opacity="0">
    <circle r="6" fill="#14b8a6" opacity=".3"/><circle r="2.8" fill="#0f766e"/>
    <animateMotion path="M656.4,217.7 A298,298 0 0 0 491.7,382.4" dur="1.1s" begin="6.8s" repeatCount="1" fill="remove" keyPoints="1;0" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="1.1s" begin="6.8s" repeatCount="1" fill="remove"/>
  </g>
</svg>
