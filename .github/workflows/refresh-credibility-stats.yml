name: Refresh credibility stats

# Keeps src/lib/credibility-stats.json (GitHub stars/forks, Docker pulls,
# PyPI/npm versions + downloads) current without someone running
# `npm run refresh:credibility` by hand. Pushes straight to main when the
# numbers actually change — approved by the team. If main's branch
# protection ever blocks this, an admin needs to add an exception for
# github-actions[bot] (see scripts/refresh-credibility-stats.mjs for what
# the script itself does).

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC — adjust if you want a different time
  workflow_dispatch: {} # lets anyone trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run refresh:credibility

      - name: Commit and push if the stats changed
        run: |
          if git diff --quiet -- src/lib/credibility-stats.json; then
            echo "No changes — stats already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/credibility-stats.json
          git commit -m "chore: refresh credibility stats"
          git push
