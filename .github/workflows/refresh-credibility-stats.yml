name: Refresh credibility stats

# Keeps src/lib/credibility-stats.json (GitHub stars/forks, Docker pulls,
# PyPI/npm versions + downloads) current without someone running
# `npm run refresh:credibility` by hand. Pushes straight to main when the
# numbers actually change — approved by the team.
#
# main is a protected branch with required status checks, and
# github-actions[bot] has no bypass, so pushing with the default workflow
# token is rejected (GH006 — verified on the first dispatch of this
# workflow). The push therefore authenticates with the
# CREDIBILITY_STATS_TOKEN repo secret: a fine-grained PAT of a repo admin
# (contents: read/write on this repo only). Admin pushes bypass the
# required checks because branch protection is not enforced for admins.
# Without the secret the run falls back to the default token and the push
# step fails loudly rather than silently skipping.
# (See scripts/refresh-credibility-stats.mjs for what the script does.)

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC — adjust if you want a different time
  workflow_dispatch: {} # lets anyone trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Falls back to the default token when the secret is unset — the
          # push then fails with GH006 instead of silently doing nothing.
          token: ${{ secrets.CREDIBILITY_STATS_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run refresh:credibility

      - name: Commit and push if the stats changed
        run: |
          if git diff --quiet -- src/lib/credibility-stats.json; then
            echo "No changes — stats already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/credibility-stats.json
          git commit -m "chore: refresh credibility stats"
          git push
